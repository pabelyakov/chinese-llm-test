---
- name: Ensure JDK is installed
  ansible.builtin.apt:
    name: "{{ jdk_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create kafka system group
  ansible.builtin.group:
    name: "{{ kafka_group }}"
    system: true

- name: Create kafka system user
  ansible.builtin.user:
    name: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    system: true
    home: "{{ kafka_data_dir }}"
    shell: /usr/sbin/nologin
    create_home: false

- name: Ensure local Kafka cache directory exists
  ansible.builtin.file:
    path: "{{ kafka_local_cache_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  run_once: true
  become: false

- name: Download Apache Kafka archive (control node, cached once)
  ansible.builtin.get_url:
    url: "{{ kafka_download_url }}"
    dest: "{{ kafka_local_cache_dir }}/{{ kafka_archive }}"
    checksum: "sha512:{{ kafka_sha512 }}"
    mode: "0644"
  delegate_to: localhost
  run_once: true
  become: false

- name: Copy Kafka archive to target host
  ansible.builtin.copy:
    src: "{{ kafka_local_cache_dir }}/{{ kafka_archive }}"
    dest: "/tmp/{{ kafka_archive }}"
    mode: "0644"

- name: Extract Apache Kafka
  ansible.builtin.unarchive:
    src: "/tmp/{{ kafka_archive }}"
    dest: "{{ kafka_install_dir }}"
    remote_src: true
    creates: "{{ kafka_release_dir }}/bin/kafka-server-start.sh"

- name: Ensure Kafka home symlink points to the release directory
  ansible.builtin.file:
    src: "{{ kafka_release_dir }}"
    dest: "{{ kafka_home }}"
    state: link
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"

- name: Ensure data / log / config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: "0755"
  loop:
    - "{{ kafka_data_dir }}"
    - "{{ kafka_log_dir }}"
    - "{{ kafka_config_dir }}"

- name: Render Kafka server.properties
  ansible.builtin.template:
    src: server.properties.j2
    dest: "{{ kafka_config_dir }}/server.properties"
    owner: root
    group: "{{ kafka_group }}"
    mode: "0644"
  notify: restart kafka

- name: Render Kafka systemd unit
  ansible.builtin.template:
    src: kafka.service.j2
    dest: "/etc/systemd/system/kafka.service"
    owner: root
    group: root
    mode: "0644"
  notify: restart kafka

- name: Check whether Kafka storage is already formatted
  ansible.builtin.stat:
    path: "{{ kafka_data_dir }}/meta.properties"
  register: kafka_meta_props

- name: Format Kafka log storage (KRaft, first run only)
  ansible.builtin.command: >-
    runuser -u {{ kafka_user }} --
    {{ kafka_home }}/bin/kafka-storage.sh format
    --config {{ kafka_config_dir }}/server.properties
    --cluster-id {{ kafka_cluster_id }}
    --ignore-formatted
  when: not kafka_meta_props.stat.exists
  changed_when: true
  notify: restart kafka

- name: Enable and start Kafka service
  ansible.builtin.systemd:
    name: kafka
    state: started
    enabled: true
    daemon_reload: true
