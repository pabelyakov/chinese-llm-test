---
- name: Install prerequisite packages (GPG + CA certs)
  ansible.builtin.apt:
    name:
      - gnupg
      - ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Download Redis GPG key (armored)
  ansible.builtin.get_url:
    url: "{{ redis_apt_repo_gpg_url }}"
    dest: /tmp/redis-archive-keyring.asc
    mode: "0644"

- name: Dearmor Redis GPG key into the apt keyring
  ansible.builtin.command:
    cmd: "gpg --batch --yes --dearmor -o {{ redis_apt_keyring_path }} /tmp/redis-archive-keyring.asc"
    creates: "{{ redis_apt_keyring_path }}"

- name: Add Redis official APT repository
  ansible.builtin.copy:
    dest: "/etc/apt/sources.list.d/{{ redis_apt_list_file }}.list"
    content: "deb [signed-by={{ redis_apt_keyring_path }}] {{ redis_apt_repo_url }} {{ ansible_facts.distribution_release }} main\n"
    owner: root
    group: root
    mode: "0644"

- name: Install Redis
  ansible.builtin.apt:
    name: redis-server
    state: present
    update_cache: true

- name: Ensure Redis data directory exists
  ansible.builtin.file:
    path: "{{ redis_data_dir }}"
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Render redis.conf
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ redis_config_file }}"
    owner: redis
    group: redis
    mode: "0640"
  notify: restart redis

- name: Enable and start Redis service
  ansible.builtin.systemd:
    name: "{{ redis_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
