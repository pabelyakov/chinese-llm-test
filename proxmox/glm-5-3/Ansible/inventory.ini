# Event-Driven лабораторный стенд — инвентарь Ansible
# IP-план: пул 192.168.1.230–.240, сеть /24
# .236, .239, .240 — резерв

[kafka]
kafka-01   ansible_host=192.168.1.230
kafka-02   ansible_host=192.168.1.231
kafka-03   ansible_host=192.168.1.232

[rabbitmq]
rabbitmq-01 ansible_host=192.168.1.233
rabbitmq-02 ansible_host=192.168.1.234
rabbitmq-03 ansible_host=192.168.1.235

[redis]
redis-01   ansible_host=192.168.1.237
redis-02   ansible_host=192.168.1.238

[redis:vars]
redis_role_master=redis-01

# Все VM стенда (для общих ролей: base, monitoring, hardened и т.п.)
[lab:children]
kafka
rabbitmq
redis

[lab:vars]
ansible_user=deploy
